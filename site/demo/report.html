  const paras = String(f.conclusion||"").split(/\n\s*\n|\n/).filter(x=>x.trim()).map(p=>`<p>${esc(p)}</p>`).join("");

function renderKpis(){
  const T = D.totals, st = D.stats;
  const pct = w => fmt(100*w/Math.max(tw,1), 1) + " %";
  const prob = (T.copy||0)+(T.para||0)+(T.noquote||0);
  const k = [
    {v: fmt(st.sentences), l: t("report.kpi_sentences"), s: t("report.kpi_sentences_sub", {words: fmt(tw)})},
    {v: pct(Object.values(T).reduce((a,b)=>a+b,0)), l: t("report.kpi_matched"), s: t("report.kpi_matched_sub", {n: fmt(st.matched_sentences)})},
    {v: pct(prob), l: t("report.kpi_problem"), s: t("report.kpi_problem_sub", {words: fmt(prob), pages: (st.problem_pages||[]).length}), alert: prob>0},
    {v: fmt(st.n_problem_sources), l: t("report.kpi_problem_sources"), s: t("report.kpi_problem_sources_sub", {n: D.sources.length}), alert: st.n_problem_sources>0},
    {v: fmt(st.n_candidates), l: t("report.kpi_candidates"), s: t("report.kpi_candidates_sub", {n: fmt(st.n_fetched)})},

  $("#kpis").innerHTML = k.map(x=>`<div class="kpi ${x.alert?"alert":""}"><div class="v">${x.v}</div><div class="l">${esc(x.l)}</div><div class="s">${esc(x.s)}</div></div>`).join("");
}

function renderComposition(){
  const T = D.totals; let used = 0;
  const parts = D.classes.map(([k]) => { used += T[k]||0; return [k, T[k]||0]; });
  parts.push(["clean", Math.max(tw-used,0)]);
  const name = k => k==="clean" ? t("report.no_matches") : clsLabel(k);
  $("#comp").innerHTML = parts.filter(p=>p[1]>0).map(([k,w]) =>
    `<div style="flex:${w};background:${classColor(k)}" title="${esc(name(k))}: ${fmt(100*w/tw,1)} %"></div>`).join("");
  $("#legend").innerHTML = parts.map(([k,w]) =>
    `<span><span class="sw" style="background:${classColor(k)}"></span>${esc(name(k))} <b>${fmt(100*w/tw,1)} %</b></span>`).join("");
}

/* page map */
const tip = $("#tip");
function showTip(e, h){ tip.innerHTML = h; tip.style.display="block";
  const x = Math.min(e.clientX+14, innerWidth-300), y = Math.min(e.clientY+14, innerHeight-160);
  tip.style.left = x+"px"; tip.style.top = y+"px"; }
function hideTip(){ tip.style.display="none"; }
function drawMap(){
  const svg = $("#pagemap"), W = svg.clientWidth || 1100, H = 150, padL = 34, padB = 22, padT = 6;
  const P = D.pages, n = Math.max(P.length, 1), bw = (W-padL-4)/n, gap = bw>4 ? 1.2 : 0.3;
  const y = v => padT + (H-padT-padB)*(1-v);
  const every = n > 120 ? 20 : n > 50 ? 10 : 5;
  let g = `<line x1="${padL}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  [0.5,1].forEach(v => g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${padL-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${v*100}%</text>`);
  P.forEach((p,i) => {
    const x = padL + i*bw; let acc = 0;
    D.classes.forEach(([k]) => { const w = (p.c||{})[k]||0; if(!w || !p.w) return;
      const v = w/p.w, h = (H-padT-padB)*v;
      g += `<rect x="${x+gap/2}" y="${y(acc+v)}" width="${Math.max(bw-gap,0.6)}" height="${Math.max(h,0.8)}" fill="${classColor(k)}" rx="${bw>6?1.5:0}"/>`;
      acc += v; });
    if (p.p % every === 0) g += `<text x="${x+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--ink3)">${p.p}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${x}" y="0" width="${bw}" height="${H-padB}"/>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = g;
  svg.querySelectorAll("rect.hit").forEach(r => {
    const p = P[+r.dataset.i];
    r.addEventListener("mousemove", e => {
      const rows = D.classes.filter(([k]) => (p.c||{})[k]).map(([k]) =>
        `<div class="row"><span><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${classColor(k)};margin-right:5px"></span>${esc(clsLabel(k))}</span><span>${fmt(100*p.c[k]/Math.max(p.w,1))} %</span></div>`).join("");
      showTip(e, `<b>${esc(t("report.page", {n: p.p}))}</b> <span class="tiny">(${esc(t("report.words_short", {n: fmt(p.w)}))})</span>${rows || `<div class="tiny">${esc(t("report.no_matches"))}</div>`}`); });
    r.addEventListener("mouseleave", hideTip);
    r.addEventListener("click", () => gotoPage(p.p));
  });
}

  const ev = s.evidence==="snippet" ? "report.ev_snippet" : s.evidence==="abstract" ? "report.ev_abstract" : "report.ev_fulltext";
  const summary = s.auto_summary ? t("report.auto_summary") : s.summary;
  return `<div class="src" style="--vc:${classColor(vc)}" data-id="${s.id}">
    <div class="top"><div>
      <div class="rank">#${i+1}</div>
      <div class="ttl">${s.local ? esc(titleOf(s)) : `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(titleOf(s))}</a>`}</div>
      <div class="dom">${esc(s.local ? t("report.local_file") : s.url)}</div></div></div>
    <div class="badges">
      <span class="badge v ${vbad}">${esc(verdictLabel(s.verdict))}</span>
      ${s.confidence!=null?`<span class="badge">${esc(t("report.confidence", {pct: fmt(s.confidence*100)}))}</span>`:""}
      ${badgeDate(s)}
      <span class="badge ${s.evidence!=="fulltext"?"warn":""}">${esc(t(ev))}</span>
      ${(s.ref_match||[]).length?`<span class="badge good" title="${esc(s.ref_match.join(" | "))}">${esc(t("report.in_refs"))}</span>`
        : (s.in_refs||[]).length?`<span class="badge">${esc(t("report.authors_in_refs", {names: s.in_refs.join(", ")}))}</span>`
        : `<span class="badge warn" title="${esc(t("report.not_in_refs_hint"))}">${esc(t("report.not_in_refs"))}</span>`}
      ${s.mentions_author?`<span class="badge">${esc(t("report.mentions_author"))}</span>`:""}
      ${(s.usage||[]).map(u=>`<span class="badge">${esc(t("usage."+u))}</span>`).join("")}
    </div>
    <div class="metrics">
      <span>${esc(t("report.m_sentences"))}: <b>${s.n_pairs}</b></span>
      <span>${esc(t("report.m_words"))}: <b>${fmt(s.words)}</b> (<b>${fmt(s.pct,2)} %</b> ${esc(t("report.m_of_text"))})</span>
      <span>${esc(t("report.m_problem"))}: <b>${fmt(s.prob_pct,2)} %</b></span>
      <span>${esc(t("report.m_longest"))}: <b>${fmt(s.longest)}</b> ${esc(t("report.words_unit"))}</span>
    </div>
    <div class="mini">${mini}</div>
    ${summary?`<div class="summary">${esc(summary)}</div>`:""}
    <div class="metrics"><span>${esc(t("report.m_pages"))}: <span class="chips">${pages}</span></span></div>
    <button class="more">${esc(t("report.show_pairs", {n: s.pairs.length}))}</button>
    <div class="pairs"></div></div>`;
}
function renderSources(){
  const q = $("#q").value.trim().toLowerCase(), fv = $("#fv").value, op = $("#onlyprob").checked;
  const list = D.sources.filter(s => (!fv || s.verdict===fv) && (!op || s.prob_words>0) &&
    (!q || (titleOf(s)+" "+s.url+" "+s.summary+" "+s.pairs.map(p=>p.d).join(" ")).toLowerCase().includes(q)));
  $("#srclist").innerHTML = list.length ? list.map(s=>srcCard(s, D.sources.indexOf(s))).join("") : `<div class="empty">${esc(t("report.no_sources_filtered"))}</div>`;
}
$("#srclist").addEventListener("click", e => {
  const b = e.target.closest("button.more");
  if (b){ const card = b.closest(".src"), box = card.querySelector(".pairs"), s = SRC[card.dataset.id];
    if (!box.innerHTML) box.innerHTML = s.pairs.map(pairHTML).join("");
    box.classList.toggle("on");
    b.textContent = t(box.classList.contains("on") ? "report.hide_pairs" : "report.show_pairs", {n: s.pairs.length}); return; }
  const c = e.target.closest(".chip");
  if (c){ const card = c.closest(".src"); $("#fsrc").value = card.dataset.id; docRendered=false; gotoPage(+c.dataset.page, true); }
});
["#q","#fv","#onlyprob"].forEach(s => $(s).addEventListener("input", renderSources));

/* document */
function renderDoc(){
  const only = $("#onlymatched").checked, fs = $("#fsrc").value;
  const byPage = {};
  D.doc.forEach(x => (byPage[x.p] ||= []).push(x));
  let h = "";
  Object.keys(byPage).map(Number).sort((a,b)=>a-b).forEach(p => {
    const arr = byPage[p];
    const has = arr.some(x => fs ? (pairIndex[x.i]||[]).some(o=>o.s.id===fs) : x.l);
    if (only && !has) return;
    h += `<div class="docpage" id="pg-${p}"><div class="pn"><span>${esc(t("report.page", {n: p}))}</span></div><p>` +
      arr.map(x => {
        let cls = x.l;
        if (fs){ const o = (pairIndex[x.i]||[]).find(o=>o.s.id===fs); cls = o ? (D.class_of[o.p.label]||"na") : ""; }
        return cls ? `<span class="s ${cls}" data-i="${x.i}">${esc(x.t)}</span> ` : esc(x.t)+" ";
      }).join("") + `</p></div>`;
  });
  $("#doc").innerHTML = h || `<div class="empty">${esc(t("report.no_matched_pages"))}</div>`;
  docRendered = true;
}
["#onlymatched","#fsrc"].forEach(s => $(s).addEventListener("input", renderDoc));
function gotoPage(p, keepFilter){
  if (!keepFilter) $("#fsrc").value = "";
  $("#onlymatched").checked = false; setTab("doc"); renderDoc();
  const el = document.getElementById("pg-"+p); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
$("#doc").addEventListener("click", e => {
  const sp = e.target.closest(".s"); if (!sp) return;
  document.querySelectorAll(".s.sel").forEach(x=>x.classList.remove("sel")); sp.classList.add("sel");
  const fs = $("#fsrc").value;
  let list = (pairIndex[+sp.dataset.i]||[]); if (fs) list = list.filter(o=>o.s.id===fs);
  list = list.slice().sort((a,b) => (b.p.cov+b.p.cont) - (a.p.cov+a.p.cont));
  $("#drawerin").innerHTML = list.map(o => `<div style="margin-bottom:6px"><b>${esc(titleOf(o.s))}</b>
     <span class="tiny">${esc(o.s.domain)} · ${esc(verdictLabel(o.s.verdict))}</span></div>${pairHTML(o.p)}`).join("<hr style='border:0;border-top:1px solid var(--line)'>")
     || `<div class="muted">${esc(t("report.no_source_text"))}</div>`;
  $("#drawer").classList.add("on");
});
$("#drawerx").addEventListener("click", () => $("#drawer").classList.remove("on"));
addEventListener("keydown", e => { if (e.key==="Escape") $("#drawer").classList.remove("on"); });

/* others */
function renderOthers(){
  $("#n-sources").textContent = D.sources.length;
  $("#n-others").textContent = D.others.length;
  $("#unsel").textContent = D.stats.n_unselected ? t("report.unselected", {n: fmt(D.stats.n_unselected)}) : "";
  $("#others").innerHTML = D.others.length ? `<table><thead><tr><th>${esc(t("report.th_source"))}</th><th>${esc(t("report.th_status"))}</th><th>${esc(t("report.th_date"))}</th><th class="num">${esc(t("report.th_hits"))}</th><th class="num">${esc(t("report.th_pairs"))}</th><th>${esc(t("report.th_reason"))}</th></tr></thead><tbody>` +
    D.others.map(o => `<tr><td>${o.local ? esc(titleOf(o).slice(0,110)) : `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(titleOf(o).slice(0,110))}</a>`}<div class="dom">${esc(o.domain)}</div></td>
      <td>${esc(t("status."+o.status))}</td><td>${esc(fmtDate(o.date) || t("date.unknown"))}${o.date && o.date_status && o.date_status!=="unknown" ? `<div class="tiny">${esc(t("date."+o.date_status))}</div>` : ""}</td>
      <td class="num">${o.hits}</td><td class="num">${o.pairs}</td><td>${esc(t("reason."+o.reason, {n: o.pairs}))}</td></tr>`).join("") + "</tbody></table>"
    : `<div class="empty">${esc(t("report.none"))}</div>`;
}

/* method */
function renderMethod(){
  const p = {from: D.meta.body_pages[0], to: D.meta.body_pages[1], sentences: fmt(D.stats.sentences)};
  $("#pane-method").innerHTML = `<div class="card">
<h2>${esc(t("report.method_title"))}</h2>
<ol>${["m1","m2","m3","m4","m5","m6"].map(k => `<li><b>${esc(t("report.method."+k+"_title"))}</b> ${esc(t("report.method."+k, p))}</li>`).join("")}</ol>
<h2>${esc(t("report.limitations"))}</h2>
<ul>${["l1","l2","l3"].map(k => `<li>${esc(t("report.method."+k))}</li>`).join("")}</ul></div>`;
  $("#footer").textContent = t("report.footer", {version: D.version || "", date: D.generated});
}

function renderAll(){
  applyStatic(); renderHeader(); renderVerdict(); renderKpis(); renderComposition(); drawMap();
  fillFilters(); renderSources(); renderOthers(); renderMethod();
  if (docRendered) renderDoc();
}
$("#lang").innerHTML = LANGS.map(c => `<option value="${c}">${esc((D.locales[c]._meta||{}).name || c)}</option>`).join("");
$("#lang").value = LANG;
if (D.embedded) $(".langsel").style.display = "none";
$("#lang").addEventListener("change", e => { LANG = e.target.value; try { localStorage.setItem("plagcheck.report.lang", LANG); } catch(err){} renderAll(); });
renderAll();
</script>
</body>
</html>
