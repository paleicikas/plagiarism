name: Website

# Publishes site/ to GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# The sample report is rebuilt from the synthetic offline demo, so it always matches the current report template.
on:
  push:
    branches: [main]
    paths: ["site/**", "plagcheck/template.html", "plagcheck/locales/**", "plagcheck/demo.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sample report from the synthetic demo
        run: python -m plagcheck.demo --out site/demo/report.html --lang en
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
